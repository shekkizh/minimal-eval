[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minieval"
version = "0.1.0"
description = "A minimal agent eval harness: inject-and-start agents in disposable sandboxes (Docker/Vercel), hidden per-task verifiers."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
minieval = "minieval.__main__:main"

[tool.setuptools.packages.find]
include = ["minieval*"]
